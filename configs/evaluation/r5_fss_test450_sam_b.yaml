seed: 17

dataset:
  kind: fss1000
  name: fss1000
  root: data/FSS-1000
  data_root: data/FSS-1000
  split_file: artifacts/protocol/splits/fss_class_disjoint_canonical66_v2.json
  train_split: train
  val_split: val
  test_split: test
  episode_manifests:
    test: artifacts/protocol/fss_manifests/fss_class_disjoint_canonical66_v2/test.json

models:
  device: cuda
  image_size: 224
  precision: fp32
  decoder_policy: single
  dino_checkpoint: artifacts/weights/dinov2_vitl14_pretrain.pth
  dino_query_cache_dir: artifacts/greedy_bc/dino_query_cache/fss1000_v2_224
  dino_query_log_every: 100
  sim_map_cache_dir: artifacts/point_baselines/cache/fss1000_v2_224
  eval_sam_checkpoint: artifacts/weights/sam_vit_b_01ec64.pth
  eval_sam_model_type: vit_b
  eval_sam_embedding_cache_dir: artifacts/rl/sam_embeddings/fss1000_vitb_224
  eval_sam_use_bfloat16: false
  eval_precision: fp32
  sam_embedding_log_every: 100

model:
  grid: 37
  hidden_channels: 96
  depth: 4
  dropout: 0.10
  use_query_rgb: false
  use_query_dino_features: true
  dino_feature_channels: 1024
  dino_proj_channels: 32
  value_hidden_dim: 256
  use_current_mask: true
  reserve_mask_channel: true

rl:
  device: cuda
  budget: 5

train:
  run_name: released_R5_fss_test450_sam_b
  condition_id: R5

evaluation:
  method_name: R5
  write_contact_sheet: false
  final_mask_sample_count: 0

experiment:
  suite: chair_v2
  evaluation_only: true
  evaluation_protocol:
    fss_test450: artifacts/protocol/fss_manifests/fss_class_disjoint_canonical66_v2/test.json

paths:
  run_root: artifacts/evaluation/released_R5
